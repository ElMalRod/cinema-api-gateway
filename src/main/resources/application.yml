server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  http:
    codecs:
      max-in-memory-size: 4MB
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    gateway:
      access: unrestricted

gateway:
  auth-service:
    base-url: ${GATEWAY_AUTH_BASE_URL:http://localhost:8081}
  services:
    auth: ${GATEWAY_SERVICE_AUTH:http://localhost:8081}
    users: ${GATEWAY_SERVICE_USERS:http://localhost:8082}
    movies: ${GATEWAY_SERVICE_MOVIES:http://localhost:8083}
    cinemas: ${GATEWAY_SERVICE_CINEMAS:http://localhost:8084}
    tickets: ${GATEWAY_SERVICE_TICKETS:http://localhost:8085}
    ads: ${GATEWAY_SERVICE_ADS:http://localhost:8086}
    reports: ${GATEWAY_SERVICE_REPORTS:http://localhost:8087}
  rate-limit:
    replenish-rate: 15
    burst-capacity: 30
    requested-tokens: 1
